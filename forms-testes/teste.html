<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
    <link rel="shortcut icon" href="../img/culturama-favico.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="../img/logo-culturama.png" alt="Logo do site (culturama)">
        <h1>Pesquisa On-line</h1>
    </header>
    <main>
        <section>
           <fieldset> 
            <legend>Dados pessoais</legend>
            <form action="" method="get"> 
                <label for="name">Nome</label>
                <input type="text" name="userName" id="name" required>
                <br>
                <label for="userAge">Idade</label>
                <input type="number" name="userAge" id="userAge" min="12" max="100" required>
                <br>
                <label for="birthDate">Data de Nascimento</label>
                <input type="date" name="birthDate" id="birthDate">
                <br>
                <label for="userEmail">Email</label>
                <input type="email" name="userEmail" id="userEmail" required>
                <br>
                <label for="userPhone">Telefone</label>
                <input type="tel" name="userPhone" id="userPhone" pattern="[0-9]{11}" placeholder="()xxxxx-xxxx">
                <br>
                <label for="userImage"></label>
                <input type="file" name="" id="userImage" accept="image/*"> 
            </fieldset>

            <fieldset>
                <legend>Perfil</legend>

                <p>Gênero:</p>

                <input type="radio" name="userGender" id="fem" value="Feminino"> 
                <label for="fem">Feminino</label>

                <input type="radio" name="userGender" id="masc" value="Masculino">
                <label for="masc">Masculino</label>

                <input type="radio" name="userGender" id="userGender" value="notInformed">
                <label for="userGender">Prefiro não informa</label>

                <br>

                <label for="maritialStatus">Estado civil:</label>
                <select name="maritialStatus" id="maritialStatus">
                    <option value="notInformed">Selecione...</option>
                    <option value="Casado">Casado</option>
                    <option value="solteiro">solteiro</option>
                    <option value="divorciado">divorciado</option>
                    <option value="viuvo">viuvo</option>
                    <option value="uniao">União eatável</option>
                </select>


                <label for="userState">Estado civil:</label>
                <select name="userState" id="userState" required>
                    <option value="Acre">Acre</option>
                    <option value="Alagoas">Alagoas</option>
                    <option value="Amapa">Amapá</option>
                    <option value="Amazonas">Amazonas</option>
                    <option value="Bahia">Bahia</option>
                    <option value="ceara">Ceará</option>
                    <option value="DistritoFederal">Distrito Federal</option>
                    <option value="EspiritoSanto">Espirito Santo</option>
                    <option value="Goias">Goiás</option>
                    <option value="Maranhão">Maranhão</option>
                    <option value="MatoGrossoDoSul">Mato Grosso do Sul</option>
                    <option value="MatoGrosso">Mato Grosso</option>
                    <option value="MinasGerais">Minas Gerais</option>
                    <option value="Para">Pará</option>
                    <option value="Para">Paraíba</option>
                    <option value="Parana">Paraná</option>
                    <option value="Pernambuco">Pernambuco</option>
                    <option value="Piaui">Piauí</option>
                    <option value="RioDeJaneiro">Rio de Janeiro</option>
                    <option value="RioGrandeDoNorte">Rio Grande do Norte</option>
                    <option value="RioGrandeDoSul">Rio Grande do Sul</option>
                    <option value="rodonia">Rondônia</option>
                    <option value="rondonia">Roraima</option>
                    <option value="santaCatarina">Santa Catarina</option>
                    <option value="saoPaulo">São Paulo</option>
                    <option value="Sergipe">Sergipe</option>
                    <option value="tocantins">Tocantins</option>
                </select>
                 <br>

                 <label for="userCity">sua ciade</label> 
                 <input type="text" name="userCity" id="userCity">

            </fieldset>
            
            <fieldset>
                <legend>Hábitos</legend>
                <p>Redes socias:</p>
                <input type="checkbox" name="social" id="social" value="instagram">
                <label for="social">Instagram</label>
                
                <br>
                
                <input type="checkbox" name="social" id="x" value="x">
                <label for="x">X</label>
                
                <br>
                
                <input type="checkbox" name="social" id="facebook" value="facebook">
                <label for="facebook">Facebook</label>
                
                <br>
                
                <input type="checkbox" name="social" id="linkedin" value="linkedin">
                <label for="linkedin">Linkedin</label>
                
                <br>

                <label for="music">Estilo musical:</label>
                <input list="styleTypes" type="text" name="UuserMusic" id="music">
                <datalist id="styleTypes">
                    <option value="Rock">
                    <option value="Brega">
                    <option value="Pop">
                    <option value="Sertanejo">
                    <option value="Eletronica">
                    <option value="Mpb">    
                </datalist>

                <br>

                <label for="favoriteColor"></label>
                <input type="color" name="favoriteColor" id="favoriteColor">
                
            </fieldset>

            <fieldset>
                <legend>Satisfãção</legend>
                <p>Avalie esse site:</p>

                <input type="radio" name="assessment" id="great" value="otimo" required>
                <label for="great">Otimo</label>

                <input type="radio" name="assessment" id="good" value="Bom">
                <label for="good">Bom</label>

                <input type="radio" name="assessment" id="soso" value="regular">
                <label for="soso">Regular</label>

                <input type="radio" name="assessment" id="bad" value="ruim" >
                <label for="bad">Ruim</label>

                <br>

                <label for="userMessage">Diga como podemos melhor se sua avalição foi ruim ou regular:</label>
                <textarea name="userMessage" id="userMessage" rows="2" cols="40"></textarea>
            </fieldset>

            <fieldset>
                <legend>Confirmacoes</legend>

                <input type="checkbox" name="userLgpd" id="userLgpdTerm" required value="accepted">
                <label for="userLgpdTerm">Eu aceito particpar da Pesquisa</label>
                
                <br>

                <input type="checkbox" name="userGetResult" id="userGet"  value="accept">
                <label for="userGet">Desejo receber o resultado por E-mail</label>
            </fieldset>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
        </form> 
           
            
        </section>
    </main>
</body>
</html>
