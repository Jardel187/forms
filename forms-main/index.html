<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <h1>Pesquisa On-line</h1>
    </header>
    <main>
        <section>
           <fieldset> <!--ele agrupa o formulario e o legend coloca um titulo-->
            <legend>Dados pessoais</legend>
            <form action="" method="get"> <!-- action um atrinuto que recebe uma url de destino dos dados (method, vai dizer qual é a forma de envio / get - os dados ficam visiveis na url / o post vai pra uma requisiçao do back-end)-->
                <label for="userName">Nome</label>
                <input type="text" name="userName" id="userName" required>
                <br>
                <label for="userAge">Idade</label>
                <input type="number" name="userAge" id="userAge" min="12" max="100" required>
                <br>
                <label for="birthDate">Data de Nascimento</label>
                <input type="date" name="birthDate" id="birthDate">
                <br>
                <label for="userEmail">Email</label>
                <input type="email" name="userEmail" id="userEmail" required>
                <br>
                <label for="userPhone">Telefone</label>
                <input type="tel" name="userPhone" id="userPhone" pattern="[0-9]{11}" placeholder="()xxxxx-xxxx">
                <br>
                <label for="userImage"></label>
                <input type="file" name="" id="userImage" accept="image/*"> <!-- vai receber aquirvos(nele precisa colocar)-->
            </fieldset>

            <fieldset>
                <legend>Perfil</legend>

                <p>Gênero:</p>

                <input type="radio" name="userGender" id="userGender" value="Feminino"> <!--no type radio voce precisar passar o valor(value)-->
                <label for="userGender">Feminino</label>

                <input type="radio" name="userGender" id="userGender" value="Masculino">
                <label for="userGender">Masculino</label>

                <input type="radio" name="userGender" id="userGender" value="notInformed">
                <label for="userGender">Prefiro não informa</label>

                <br>

                <label for="maritialStatus">Estado civil:</label>
                <select name="maritialStatus" id="maritialStatus">
                    <option value="notInformed">Selecione...</option>
                    <option value="Casado">Casado</option>
                    <option value="solteiro">solteiro</option>
                    <option value="divorciado">divorciado</option>
                    <option value="viuvo">viuvo</option>
                    <option value="uniao">União eatável</option>
                </select>


                <label for="userState">Estado civil:</label>
                <select name="userState" id="userState">
                    <option value="Acre">Acre</option>
                    <option value="Alagoas">Alagoas</option>
                    <option value="Amapá">Amapá</option>
                    <option value="Amazonas">Amazonas</option>
                    <option value="Bahia">Bahia</option>
                    <option value="ceara">Ceará</option>
                    <option value="Distrito Federal">Distrito Federal</option>
                    <option value="Espirito Santo">Espirito Santo</option>
                    <option value="Goiás">Goiás</option>
                    <option value="Maranhão">Maranhão</option>
                    <option value="Mato Grosso do Sul">Mato Grosso do Sul</option>
                    <option value="Mato Grosso">Mato Grosso</option>
                    <option value="Minas Gerais">Minas Gerais</option>
                    <option value="Pará">Pará</option>
                    <option value="Pará">Paraíba</option>
                    <option value="Paraná">Paraná</option>
                    <option value="Pernambuco">Pernambuco</option>
                    <option value="Piauí">Piauí</option>
                    <option value="Rio de Janeiro">Rio de Janeiro</option>
                    <option value="Rio Grande do Norte">Rio Grande do Norte</option>
                    <option value="Rio Grande do Sul">Rio Grande do Sul</option>
                    <option value="">Rondônia</option>
                    <option value="Rondônia">Roraima</option>
                    <option value="Santa Catarina">Santa Catarina</option>
                    <option value="São Paulo">São Paulo</option>
                    <option value="Sergipe">Sergipe</option>
                    <option value="Tocantins">Tocantins</option>
                </select>

            </fieldset>
                <button type="submit">Enviar</button>
            </form> 
           
            
        </section>
    </main>
</body>
</html>
